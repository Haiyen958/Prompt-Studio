- id: pasted-content-01-raw-meeting-notes
  category: pasted_content
  target: chat
  request: "Biên bản họp 14/11: Minh phụ trách xong trang thanh toán trước thứ Sáu. Lan kiểm tra lại hợp đồng đối tác vận chuyển. Quyết định lùi ngày chạy quảng cáo sang tuần sau."
  expect_min_vars: 1
  forbid_exact: "Minh phụ trách xong trang thanh toán"

- id: pasted-content-02-raw-error-log
  category: pasted_content
  target: agent
  request: "panic: runtime error: invalid memory address or nil pointer dereference at internal/checkout/service.go:84 when discountCode is empty"
  expect_zero_vars: true
  expect_high_impact: true
  must_contain_any: ["internal/checkout/service.go:84", "discountCode"]

