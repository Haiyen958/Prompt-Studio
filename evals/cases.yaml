- id: clear-01-video-search-spec
  category: clear
  target: chat
  request: "Tôi cần prompt để thiết kế tính năng tìm kiếm cho kho 50.000 video quảng cáo của đội marketing, hỗ trợ lọc theo ngành hàng và thời lượng."
  sample_vars:
    thong_tin_dau_vao: "Kho 50.000 video TikTok & Reels ngành FMCG"
    doi_tuong_muc_tieu: "Performance Marketing Team"

- id: clear-02-go-pr-concurrency-review
  category: clear
  target: agent
  request: "Tôi cần prompt để agent review một pull request Go, tập trung vào lỗi xử lý đồng thời, race condition và rò rỉ goroutine."
  sample_vars:
    pham_vi_tap_tin: "internal/worker/pool.go"

- id: clear-03-api-invoice-json
  category: clear
  target: api
  request: "System prompt cho API trích xuất tên nhà cung cấp, ngày hóa đơn ISO-8601, danh sách mặt hàng và tổng tiền từ văn bản OCR hóa đơn sang JSON."
  expect_api_split: true
  sample_vars:
    ngu_canh: "Hóa đơn GTGT nội địa Việt Nam"
    du_lieu_dau_vao: "Công ty TNHH Sao Mai - Ngày 15/11/2026 - Tổng thanh toán: 12.500.000 VND"

- id: clear-04-postgres-readonly-sql
  category: clear
  target: api
  request: "Tôi cần system prompt cho API chuyển câu hỏi tiếng Việt của bộ phận kinh doanh thành truy vấn PostgreSQL chỉ đọc an toàn."
  expect_api_split: true

- id: clear-05-payment-500-bugfix
  category: clear
  target: agent
  request: "Tôi cần prompt để agent chẩn đoán nguyên nhân gốc rễ, viết regression test và sửa lỗi API thanh toán thỉnh thoảng trả 500 khi gửi trùng request."

- id: clear-06-saas-onboarding-prd
  category: clear
  target: chat
  request: "Viết PRD và danh sách user story kèm tiêu chí nghiệm thu Gherkin cho luồng đăng ký dùng thử B2B SaaS không cần thẻ tín dụng."

