<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thêm prompt vào thư viện</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111214}
:root{color-scheme:dark}
::placeholder{color:#8B8F96}
button,input,select,textarea{font-family:inherit}
.ai-frame{transition:box-shadow .3s ease}
.ai-frame:focus-within{border-color:#4A5A8F !important;box-shadow:0 0 0 1px #7C9BFF55,0 0 28px -8px #7C9BFF88}
</style>
</head>
<body>
<div style="width: 640px; height: 760px; box-sizing: border-box; background: rgba(8,9,10,0.72); font-family: Inter, system-ui, sans-serif; color: #ECECEA; font-size: 14px; line-height: 1.5; display: flex; align-items: center; justify-content: center; padding: 24px">
  <section role="dialog" aria-labelledby="add-title" style="width: 100%; background: #1A1C1F; border: 1px solid #2A2D31; border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); display: flex; flex-direction: column">
    <header style="display: flex; align-items: center; gap: 8px; padding: 16px 20px; border-bottom: 1px solid #24272B">
      <h2 id="add-title" style="margin: 0; font-size: 16px; font-weight: 600; flex-grow: 1">Thêm prompt vào thư viện</h2>
      <button aria-label="Đóng" style="width: 32px; height: 32px; border: 0; background: transparent; border-radius: 8px; color: #A8ABB0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>

    <div style="padding: 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="paste" style="font-size: 13px; font-weight: 500">Nội dung prompt</label>
        <div class="ai-frame" style="border: 1px solid #3A3E44; border-radius: 12px; background: #111214; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
          <textarea id="paste" rows="8" style="border: 0; resize: vertical; outline: none; background: transparent; color: #DDDEE0; font-size: 13px; line-height: 1.6; font-family: ui-monospace, Menlo, monospace; padding: 0">Bạn là nhà nghiên cứu UX. Soạn bộ câu hỏi phỏng vấn mở về {{chu_de}} cho nhóm người dùng {{doi_tuong}}.

Yêu cầu:
- 10–12 câu, chia theo 3 phần: bối cảnh, hành vi hiện tại, khó khăn.
- Tránh câu hỏi dẫn dắt hoặc có/không.
- Mỗi câu kèm 1 câu hỏi đào sâu.</textarea>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: #8B8F96">
            <span style="color: #5EEAD4; background: #10302B; padding: 2px 8px; border-radius: 999px">2 biến: chu_de, doi_tuong</span>
            <span style="flex-grow: 1"></span>
            <span>286 / 32.000</span>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 12px">
        <div style="flex: 2 1 260px; display: flex; flex-direction: column; gap: 6px">
          <label for="ttl" style="font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px">Tiêu đề</label>
          <input id="ttl" type="text" value="Bộ câu hỏi phỏng vấn người dùng" style="height: 40px; border: 1px solid #3A3E44; border-radius: 10px; background: #111214; color: #ECECEA; font-size: 14px; padding: 0 12px">
        </div>
        <div style="flex: 1 1 180px; display: flex; flex-direction: column; gap: 6px">
          <label for="col" style="font-size: 13px; font-weight: 500">Collection</label>
          <select id="col" style="height: 40px; border: 1px solid #3A3E44; border-radius: 10px; background: #111214; color: #ECECEA; font-size: 14px; padding: 0 10px">
            <option>Sản phẩm &amp; UX</option><option>Marketing</option><option>Lập trình</option><option>Chưa phân loại</option><option>+ Tạo collection mới…</option>
          </select>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="desc" style="font-size: 13px; font-weight: 500">Mô tả <span style="color: #8B8F96; font-weight: 400">· không bắt buộc</span></label>
        <input id="desc" type="text" placeholder="Dùng khi chuẩn bị buổi phỏng vấn khám phá" style="height: 40px; border: 1px solid #3A3E44; border-radius: 10px; background: #111214; color: #ECECEA; font-size: 14px; padding: 0 12px">
      </div>

      <div role="status" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: #2B2210; border: 1px solid #5A4518; border-radius: 10px; font-size: 13px; color: #F2C66D">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.5"/></svg>
        <span>Prompt này đã có trong thư viện. <a href="library.html" style="color: #F2C66D">Mở bản đã lưu</a></span>
      </div>
    </div>

    <footer style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 20px; border-top: 1px solid #24272B">
      <span style="flex-grow: 1; font-size: 12px; color: #8B8F96">Tiêu đề lấy từ dòng đầu, sửa được</span>
      <button style="height: 40px; padding: 0 16px; border: 1px solid #3A3E44; background: #22252A; border-radius: 10px; font-size: 14px; font-weight: 500; color: #ECECEA; cursor: pointer">Hủy</button>
      <a href="library.html" style="height: 40px; padding: 0 18px; border-radius: 10px; background: #7C9BFF; color: #0E1220; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center">Lưu vào thư viện</a>
    </footer>
  </section>
</div>
</body>
</html>
