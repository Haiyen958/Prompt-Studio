
name: Build Prompt Studio for Mac M4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      - name: Build Apple Silicon
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 \
          go build -trimpath -ldflags="-s -w" \
          -o dist/prompt-studio ./cmd/prompt-studio

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: prompt-studio-mac-arm64
          path: dist/prompt-studio
